<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" aria-label="Curtis mark">
  <!-- Canonical Curtis mark, 2026-10 rebrand (source: ~/Downloads/modern-logo.svg,
       recolored to the mood board's --live green). Stripes are CUTOUTS (mask),
       not white fills, so the transparent PNG renders on any theme surface.
       The 24px ribbon adaptation lives in src/icons.ts (thickened ring/stripes,
       currentColor) — keep the geometry in sync when editing either. -->
  <defs>
    <mask id="curtis-mark-stripes">
      <rect width="540" height="540" fill="#ffffff"/>
      <rect x="0" y="144" width="540" height="8" fill="#000000"/>
      <rect x="0" y="192" width="540" height="8" fill="#000000"/>
      <rect x="0" y="340" width="540" height="8" fill="#000000"/>
      <rect x="0" y="388" width="540" height="8" fill="#000000"/>
    </mask>
  </defs>
  <circle cx="270" cy="270" r="258" fill="none" stroke="#1E7A46" stroke-width="10"/>
  <path d="M400.8 139.2 A185 185 0 1 0 400.8 400.8 L344.2 344.2 A105 105 0 1 1 344.2 195.8 Z" fill="#1E7A46" mask="url(#curtis-mark-stripes)"/>
</svg>
